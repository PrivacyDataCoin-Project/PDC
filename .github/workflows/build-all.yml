name: Build all platforms

# Fans selected platform workflows into a single run (mainnet only).
# Platform workflows stay independently dispatchable via workflow_dispatch;
# this one calls them through workflow_call.

on:
  push:
    branches: [CI2]
  workflow_dispatch:
    inputs:
      linux:
        description: 'Linux'
        type: boolean
        default: true
      windows:
        description: 'Windows'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-selection:
    name: Check selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: At least one platform must be selected
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            lin=true
            win=true
          else
            lin='${{ inputs.linux }}'
            win='${{ inputs.windows }}'
          fi

          if [ "$lin" != "true" ] && [ "$win" != "true" ]; then
            echo "::error title=No platform selected::Tick at least one of Linux, Windows."
            exit 1
          fi

          {
            echo "### Building mainnet"
            echo
            echo "| Platform | mainnet |"
            echo "| --- | --- |"
            for row in "Linux:$lin" "Windows:$win"; do
              name=${row%%:*}; sel=${row##*:}
              cell=$([ "$sel" = "true" ] && echo 'yes' || echo '-')
              echo "| $name | $cell |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  linux-mainnet:
    name: Linux (mainnet)
    needs: check-selection
    if: ${{ !cancelled() && needs.check-selection.result == 'success' && (github.event_name == 'push' || inputs.linux == true) }}
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  windows-mainnet:
    name: Windows (mainnet)
    needs: check-selection
    if: ${{ !cancelled() && needs.check-selection.result == 'success' && (github.event_name == 'push' || inputs.windows == true) }}
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
