name: Build CLI
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.ref }}

jobs:
# Common Build matrix for builds on Ubuntu Lasted VM

  ubuntu_now_build:
    name: ${{ matrix.build_name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Add more compilers here if you need them
        #build_name: ['Ubuntu 24.04']
        include:
          - build_name: 'Ubuntu 22.04 - GCC'
            package_name: 'gcc g++'
            cc: gcc
            cxx: g++
            label: ubuntu-22.04
            deployable: true

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      LABEL: ${{ matrix.label }}
      BOOST_ROOT_DIR: ${{ github.workspace }}/boost_1_84_0
      OPENSSL_PREFIX: ${{ github.workspace }}/openssl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      # Fetch Dependencies
      - name: Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y build-essential python3-dev curl autotools-dev libicu-dev libbz2-dev cmake git zlib1g-dev ccache ${{ matrix.package_name }}

      - name: Cache Boost 1.84.0
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT_DIR }}
          key: boost-1.84.0-${{ matrix.label }}-cli-v1

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost_1_84_0.tar.bz2 https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2
          tar -xjf boost_1_84_0.tar.bz2
          cd boost_1_84_0
          ./bootstrap.sh --with-libraries=system,filesystem,thread,date_time,chrono,regex,serialization,atomic,program_options,locale,timer,log
          ./b2 -j"$(nproc)"
          cd ..

      - name: Cache OpenSSL 1.1.1w
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-1.1.1w-${{ matrix.label }}-v1

      - name: Install OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -fL -o openssl-1.1.1w.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          tar xaf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w/
          ./config --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}" shared zlib
          make -j"$(nproc)"
          make install_sw
          cd ..

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-cli-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-cli-${{ matrix.label }}-

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          ccache -z
          mkdir -p build && cd build
          cmake \
            -D BOOST_ROOT="${BOOST_ROOT_DIR}" \
            -D OPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \
            -D BUILD_GUI=OFF \
            -D STATIC=true \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=OFF \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"
          ccache -s

      # Prepare for deploy
      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src
          TARGETS="pdcd connectivity_tool simplewallet"
          if [[ "${LABEL}" != "aarch64" ]]; then strip ${TARGETS}; fi
          rm -rf Pdc-${TAG}
          mkdir Pdc-${TAG}
          cp ${TARGETS} Pdc-${TAG}/
          # upload-artifact zip of bare dirs drops +x; set modes before tar and publish the archive.
          chmod a+x Pdc-${TAG}/*
          tar cvfz Pdc-${TAG}-${LABEL}.tar.gz Pdc-${TAG}/
          echo "PKG_TAG=${TAG}" >> "$GITHUB_ENV"

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release' && matrix.deployable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Pdc-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_name: Pdc-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_content_type: application/gzip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pdc-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Pdc-${{ env.PKG_TAG }}-${{ env.LABEL }}.tar.gz


  # Mac builds on Catalina VM
  macos_build:
    name: macOS
    runs-on: macos-14
    env:
      LABEL: osx
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      BOOST_ROOT_DIR: ${{ github.workspace }}/boost_1_84_0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Fetch Dependencies
      - name: Dependencies
        run: |
          brew install --force ccache cmake openssl@3

      - name: Cache Boost 1.84.0
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT_DIR }}
          key: boost-1.84.0-macos-14-cli-static-icu-off-v1

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost_1_84_0.tar.bz2 https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2
          tar -xjf boost_1_84_0.tar.bz2
          cd boost_1_84_0
          ./bootstrap.sh
          ./b2 -j"$(sysctl -n hw.ncpu)" link=static variant=release threading=multi boost.locale.icu=off
          cd ..

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-cli-osx-${{ github.sha }}
          restore-keys: |
            ccache-cli-osx-

      # Configure project with cmake
      - name: Configure
        run: |
          ccache -z
          mkdir -p build && cd build
          cmake \
            -D BOOST_ROOT="${BOOST_ROOT_DIR}" \
            -D BOOST_LIBRARYDIR="${BOOST_ROOT_DIR}/stage/lib" \
            -D OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
            -D OPENSSL_USE_STATIC_LIBS=TRUE \
            -D BUILD_GUI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=OFF \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..

      # Build for macOS
      - name: Build
        run: |
          cd build
          make -j"$(sysctl -n hw.ncpu)"
          ccache -s

       # Prepare for deploy
      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src
          TARGETS="pdcd connectivity_tool simplewallet"
          if [[ "${LABEL}" != "aarch64" ]]; then strip ${TARGETS}; fi
          for b in ${TARGETS}; do
            echo "==== otool $b ===="
            otool -L "$b"
            if otool -L "$b" | grep -E '@rpath/libboost_|/Users/runner/|libboost_[^ ]*\.dylib|/opt/homebrew/.*/libssl|/opt/homebrew/.*/libcrypto|/usr/local/opt/openssl'; then
              echo "ERROR: $b still depends on a non-portable Boost/OpenSSL path"
              exit 1
            fi
          done
          rm -rf Pdc-${TAG}
          mkdir Pdc-${TAG}
          cp ${TARGETS} Pdc-${TAG}/
          # upload-artifact zip of bare dirs drops +x; set modes before tar and publish the archive.
          chmod a+x Pdc-${TAG}/*
          tar cvfz Pdc-${TAG}-${LABEL}.tar.gz Pdc-${TAG}/
          echo "PKG_TAG=${TAG}" >> "$GITHUB_ENV"

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Pdc-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_name: Pdc-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_content_type: application/gzip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pdc-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Pdc-${{ env.PKG_TAG }}-${{ env.LABEL }}.tar.gz


  # Windows 10
  windows_build:
    name: Windows
    runs-on: windows-2022
    env:
      MSBUILD_PATH: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin"
      LABEL: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Boost.Asio 1.84 still uses OpenSSL 1.1 ASN.1 internals; Chocolatey OpenSSL 4.x breaks the Windows build.
      - name: Cache OpenSSL 1.1.1w
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: C:/OpenSSL-Win64
          key: openssl-1.1.1w-win64-msvc2022-nasm-off

      - name: Install OpenSSL 1.1.1w
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fL -o openssl-1.1.1w.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          tar -xzf openssl-1.1.1w.tar.gz
          $vcvars = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
          $prefix = 'C:\OpenSSL-Win64'
          cmd /c "`"$vcvars`" && cd openssl-1.1.1w && perl Configure VC-WIN64A no-asm --prefix=$prefix --openssldir=$prefix && nmake && nmake install_sw"
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL 1.1.1w build failed' }
          if (-not (Test-Path "$prefix\include\openssl\ssl.h")) { throw 'OpenSSL ssl.h missing after install' }

      - name: Export OpenSSL 1.1.1w
        shell: pwsh
        run: |
          $prefix = 'C:\OpenSSL-Win64'
          echo "OPENSSL_ROOT_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "OpenSSL root: $prefix"

      - name: Cache Boost 1.84.0
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: C:/local/boost_1_84_0
          key: boost-1.84.0-win64-msvc-14.3-v1

      - name: Install Boost 1.84.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $link = "https://boost.teeks99.com/bin/1.84.0/boost_1_84_0-msvc-14.3-64.exe"
          $path = "C:\boost.exe"
          [Net.WebClient]::new().DownloadFile($link, $path)
          Start-Process C:\boost.exe -ArgumentList "/DIR=C:\local\boost_1_84_0","/VERYSILENT" -Wait
          Get-ChildItem C:\local\boost_1_84_0

      # Configure project with cmake
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -T host=x64 .. -DBUILD_GUI=OFF -D BOOST_ROOT=C:/local/boost_1_84_0 -D BOOST_LIBRARYDIR="C:/local/boost_1_84_0/lib64-msvc-14.3" -D OPENSSL_ROOT_DIR=C:/OpenSSL-Win64 -D STATIC=OFF

      # Build for Windows
      - name: Build
        run: |
          $env:PATH = "$env:PATH;$env:MSBUILD_PATH"
          cd build
          dir
          MSBuild Pdc.sln /p:Configuration=Release /t:Build /m

      # Prepare for deploy
      - name: Prepare for Deploy
        shell: bash
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src/Release
          rm -rf Pdc-${TAG}
          mkdir Pdc-${TAG}
          cp *.exe Pdc-${TAG}/
          cp /c/OpenSSL-Win64/bin/libssl-1_1-x64.dll Pdc-${TAG}/ || true
          cp /c/OpenSSL-Win64/bin/libcrypto-1_1-x64.dll Pdc-${TAG}/ || true
          7z a Pdc-${TAG}-${LABEL}.zip Pdc-${TAG}/

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Release/Pdc-${{ github.event.release.tag_name }}-${{ env.LABEL }}.zip
          asset_name: Pdc-${{ github.event.release.tag_name }}-${{ env.LABEL }}.zip
          asset_content_type: application/zip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pdc-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Release/Pdc-${{ github.sha }}
