name: Build GUI
on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.ref }}

jobs:

# Common Build matrix for builds on Ubuntu Lasted VM
  ubuntu_build:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      LABEL: ubuntu-22.04
      CC: gcc-11
      CXX: g++-11
      BOOST_ROOT_DIR: ${{ github.workspace }}/boost_1_80_0
      OPENSSL_PREFIX: ${{ github.workspace }}/openssl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

       # Fetch Dependencies
      - name: Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y curl build-essential python3-dev autotools-dev libicu-dev libbz2-dev cmake git zlib1g-dev fuse libfuse2 libxcb-xinerama0 gcc-11 g++-11 ccache

      - name: Cache Boost 1.80.0
        id: cache-boost
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_ROOT_DIR }}
          key: boost-1.80.0-ubuntu-22.04-gui-v1

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost_1_80_0.tar.bz2 https://archives.boost.io/release/1.80.0/source/boost_1_80_0.tar.bz2
          tar -xjf boost_1_80_0.tar.bz2
          cd boost_1_80_0
          ./bootstrap.sh --with-libraries=system,filesystem,thread,date_time,chrono,regex,serialization,atomic,program_options,locale,timer,log
          ./b2 -j"$(nproc)"
          cd ..

      - name: Cache OpenSSL 1.1.1w
        id: cache-openssl
        uses: actions/cache@v6
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-1.1.1w-ubuntu-22.04-gui-v1

      - name: Install OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -fL -o openssl-1.1.1w.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          tar xaf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w/
          ./config --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}" shared zlib
          make -j"$(nproc)"
          make install_sw
          cd ..

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '5.12.12'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'debug_info qtcharts qtdatavis3d qtnetworkauth qtpurchasing qtscript qtvirtualkeyboard qtwebengine qtwebglplugin'

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gui-ubuntu-22.04-${{ github.sha }}
          restore-keys: |
            ccache-gui-ubuntu-22.04-

     # Configure the project with cmake
      - name: Configure
        run: |
          ccache -z
          mkdir -p build && cd build
          cmake \
            -D STATIC=TRUE \
            -D BOOST_ROOT="${BOOST_ROOT_DIR}" \
            -D OPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \
            -D CMAKE_PREFIX_PATH=/home/runner/work/PDC/Qt/5.12.12/gcc_64 \
            -D BUILD_GUI=ON \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=OFF \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..

      # Build for linux
      - name: Build
        run: |
          cd build
          make -j"$(nproc)"
          ccache -s

      # Prepare for deploy
      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          prj_root=$(pwd)

          echo Pdc Gui Tar.Gz

          cd build/src
          TARGETS="pdcd connectivity_tool simplewallet Pdc"
          if [[ "${LABEL}" != "aarch64" ]]; then strip ${TARGETS}; fi
          rm -rf Pdc-Gui-${TAG}
          mkdir Pdc-Gui-${TAG}
          cp ${TARGETS} Pdc-Gui-${TAG}/
          ls
          cp -r ../../src/gui/qt-daemon/layout/html Pdc-Gui-${TAG}/html
          cp ../../utils/buildings/linux/64bit/Pdc.sh Pdc-Gui-${TAG}/
          cp ../../utils/buildings/linux/64bit/Pdc.desktop Pdc-Gui-${TAG}/
          # qt.conf remaps Prefix/Data away from the CI path baked into Qt WebEngine.
          cp ../../utils/buildings/linux/64bit/qt.conf Pdc-Gui-${TAG}/
          QT_ROOT=/home/runner/work/PDC/Qt/5.12.12/gcc_64
          mkdir Pdc-Gui-${TAG}/lib
          cp ${QT_ROOT}/lib/libicudata.so.56 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libicui18n.so.56 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libicuuc.so.56 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Core.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5DBus.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Gui.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Network.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5OpenGL.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Positioning.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5PrintSupport.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Qml.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Quick.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Sensors.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Sql.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5Widgets.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5WebEngine.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5WebEngineCore.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5WebEngineWidgets.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5WebChannel.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5XcbQpa.so.5 Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/lib/libQt5QuickWidgets.so.5 Pdc-Gui-${TAG}/lib/
          # Ship OpenSSL 1.1.1 used at build time; host OpenSSL 3 breaks QSslSocket.
          cp -a "${OPENSSL_PREFIX}/lib/libssl.so"* Pdc-Gui-${TAG}/lib/
          cp -a "${OPENSSL_PREFIX}/lib/libcrypto.so"* Pdc-Gui-${TAG}/lib/
          cp ${QT_ROOT}/libexec/QtWebEngineProcess Pdc-Gui-${TAG}/
          mkdir -p Pdc-Gui-${TAG}/resources
          cp ${QT_ROOT}/resources/qtwebengine_resources.pak Pdc-Gui-${TAG}/resources/
          cp ${QT_ROOT}/resources/qtwebengine_resources_100p.pak Pdc-Gui-${TAG}/resources/
          cp ${QT_ROOT}/resources/qtwebengine_resources_200p.pak Pdc-Gui-${TAG}/resources/
          cp ${QT_ROOT}/resources/icudtl.dat Pdc-Gui-${TAG}/resources/
          cp ${QT_ROOT}/resources/qtwebengine_devtools_resources.pak Pdc-Gui-${TAG}/resources/
          mkdir -p Pdc-Gui-${TAG}/translations
          cp -a ${QT_ROOT}/translations/qtwebengine_locales Pdc-Gui-${TAG}/translations/
          mkdir Pdc-Gui-${TAG}/lib/platforms
          cp ${QT_ROOT}/plugins/platforms/libqxcb.so Pdc-Gui-${TAG}/lib/platforms/
          mkdir -p Pdc-Gui-${TAG}/lib/xcbglintegrations
          cp ${QT_ROOT}/plugins/xcbglintegrations/libqxcb-glx-integration.so Pdc-Gui-${TAG}/lib/xcbglintegrations/
          test -f Pdc-Gui-${TAG}/resources/icudtl.dat
          test -d Pdc-Gui-${TAG}/translations/qtwebengine_locales
          test -f Pdc-Gui-${TAG}/lib/libssl.so.1.1
          test -f Pdc-Gui-${TAG}/qt.conf
          # upload-artifact zip of bare dirs drops +x; set modes before tar and publish the archive.
          chmod a+x Pdc-Gui-${TAG}/pdcd Pdc-Gui-${TAG}/connectivity_tool Pdc-Gui-${TAG}/simplewallet Pdc-Gui-${TAG}/Pdc \
            Pdc-Gui-${TAG}/Pdc.sh Pdc-Gui-${TAG}/QtWebEngineProcess
          chmod a+r Pdc-Gui-${TAG}/Pdc.desktop Pdc-Gui-${TAG}/qt.conf
          tar cvfz Pdc-Gui-${TAG}-${LABEL}.tar.gz Pdc-Gui-${TAG}/

          echo Pdc GUI AppImage

          rm -rf Pdc-GUI-${TAG}
          mkdir Pdc-GUI-${TAG}
          mkdir -p Pdc-GUI-${TAG}/usr/bin
          mkdir -p Pdc-GUI-${TAG}/usr/lib
          mkdir -p Pdc-GUI-${TAG}/usr/share/applications
          mkdir -p Pdc-GUI-${TAG}/usr/share/icons/hicolor/scalable/apps
          mkdir -p Pdc-GUI-${TAG}/usr/share/icons/hicolor/256x256/apps
          cp -r ../../src/gui/qt-daemon/layout/html Pdc-GUI-${TAG}/usr/bin/
          cp ${TARGETS} Pdc-GUI-${TAG}/usr/bin/
          cp ../../utils/buildings/linux/64bit/qt.conf Pdc-GUI-${TAG}/usr/bin/
          # Seed OpenSSL 1.1 before linuxdeployqt so SSL resolves inside the AppImage.
          cp -a "${OPENSSL_PREFIX}/lib/libssl.so"* Pdc-GUI-${TAG}/usr/lib/
          cp -a "${OPENSSL_PREFIX}/lib/libcrypto.so"* Pdc-GUI-${TAG}/usr/lib/
          cp ../../utils/buildings/linux/64bit/Pdc.desktop Pdc-GUI-${TAG}/usr/share/applications/Pdc.desktop
          cp ../../resources/app_icon.svg Pdc-GUI-${TAG}/usr/share/icons/hicolor/scalable/apps/Pdc.svg
          cp ../../resources/app_icon_256.png Pdc-GUI-${TAG}/usr/share/icons/hicolor/256x256/apps/Pdc.png
          echo "Exec=$prj_root/build/src/Pdc-GUI-${TAG}/usr/bin/Pdc" >> Pdc-GUI-${TAG}/usr/share/applications/Pdc.desktop
          rm -rf /home/runner/work/_temp/
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod 777 linuxdeployqt-continuous-x86_64.AppImage
          /home/runner/work/PDC/PDC/build/src/linuxdeployqt-continuous-x86_64.AppImage ./Pdc-GUI-${TAG}/usr/share/applications/Pdc.desktop -qmake=/home/runner/work/PDC/Qt/5.12.12/gcc_64/bin/qmake
          # Ensure WebEngine ICU/locales survive linuxdeployqt (layout expected by qt.conf).
          mkdir -p Pdc-GUI-${TAG}/usr/bin/resources Pdc-GUI-${TAG}/usr/bin/translations
          cp -n /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/icudtl.dat Pdc-GUI-${TAG}/usr/bin/resources/ 2>/dev/null || \
            cp /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/icudtl.dat Pdc-GUI-${TAG}/usr/bin/resources/
          cp -n /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/qtwebengine_resources*.pak Pdc-GUI-${TAG}/usr/bin/resources/ 2>/dev/null || true
          cp /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/qtwebengine_resources.pak Pdc-GUI-${TAG}/usr/bin/resources/
          cp /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/qtwebengine_resources_100p.pak Pdc-GUI-${TAG}/usr/bin/resources/
          cp /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/qtwebengine_resources_200p.pak Pdc-GUI-${TAG}/usr/bin/resources/
          cp /home/runner/work/PDC/Qt/5.12.12/gcc_64/resources/qtwebengine_devtools_resources.pak Pdc-GUI-${TAG}/usr/bin/resources/
          cp -a /home/runner/work/PDC/Qt/5.12.12/gcc_64/translations/qtwebengine_locales Pdc-GUI-${TAG}/usr/bin/translations/
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 777 appimagetool-x86_64.AppImage
          rm -rf Pdc-GUI-${TAG}/AppRun
          cp ../../utils/buildings/linux/64bit/pdc_appimage_wrapper.sh Pdc-GUI-${TAG}/AppRun
          chmod 777 Pdc-GUI-${TAG}/*
          chmod 777 Pdc-GUI-${TAG}/*/*
          chmod 777 Pdc-GUI-${TAG}/*/*/*
          chmod 777 Pdc-GUI-${TAG}/*/*/*/*
          chmod 777 Pdc-GUI-${TAG}/*/*/*/*/*
          ARCH=x86_64 /home/runner/work/PDC/PDC/build/src/appimagetool-x86_64.AppImage ./Pdc-GUI-${TAG} Pdc-GUI-${TAG}-${LABEL}.AppImage
          chmod a+x Pdc-GUI-${TAG}-${LABEL}.AppImage
          # Tag pushes name packages with the tag; copy to sha names for artifact upload.
          # Branch pushes already use sha names — skip same-file cp (GNU cp errors).
          if [[ "${TAG}" != "${COMMIT_SHA}" ]]; then
            cp -f "Pdc-Gui-${TAG}-${LABEL}.tar.gz" "Pdc-Gui-${COMMIT_SHA}-${LABEL}.tar.gz"
            cp -f "Pdc-GUI-${TAG}-${LABEL}.AppImage" "Pdc-GUI-${COMMIT_SHA}-${LABEL}.AppImage"
          fi

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_content_type: application/gzip

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Pdc-GUI-${{ github.event.release.tag_name }}-${{ env.LABEL }}.AppImage
          asset_name: Pdc-GUI-${{ github.event.release.tag_name }}-${{ env.LABEL }}.AppImage
          asset_content_type: application/octet-stream

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}.tar.gz

      # Upload to GH Actions Artifacts AppData
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pdc-GUI-${{ github.sha }}-${{ env.LABEL }}.AppImage
          path: ./build/src/Pdc-GUI-${{ github.sha }}-${{ env.LABEL }}.AppImage

 # Mac builds on Catalina VM
  macos_build:
    name: macOS
    runs-on: macos-latest
    env:
      LABEL: osx
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
      BOOST_ROOT_DIR: ${{ github.workspace }}/boost_1_84_0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Fetch Dependencies
      - name: Dependencies
        run: |
          brew install --force ccache cmake openssl@3 qt qtwebengine

      - name: Cache Boost 1.84.0
        id: cache-boost
        uses: actions/cache@v6
        with:
          path: ${{ env.BOOST_ROOT_DIR }}
          key: boost-1.84.0-macos-latest-gui-static-icu-off-v1

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost_1_84_0.tar.bz2 https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2
          tar -xjf boost_1_84_0.tar.bz2
          cd boost_1_84_0
          ./bootstrap.sh
          ./b2 -j"$(sysctl -n hw.ncpu)" link=static variant=release threading=multi boost.locale.icu=off
          cd ..

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gui-osx-${{ github.sha }}
          restore-keys: |
            ccache-gui-osx-

      # Configure project with cmake
      - name: Configure
        run: |
          ccache -z
          mkdir -p build && cd build
          cmake \
            -D BOOST_ROOT="${BOOST_ROOT_DIR}" \
            -D BOOST_LIBRARYDIR="${BOOST_ROOT_DIR}/stage/lib" \
            -D OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
            -D OPENSSL_USE_STATIC_LIBS=TRUE \
            -D CMAKE_PREFIX_PATH="/opt/homebrew/opt/qt;/opt/homebrew/opt/qtwebengine" \
            -D BUILD_GUI=TRUE \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=OFF \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..

      # Build for macOS
      - name: Build
        run: |
          cd build
          make -j"$(sysctl -n hw.ncpu)"
          ccache -s

       # Prepare for deploy: package Pdc.app (GUI) with helpers + html
      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src
          ls
          test -d Pdc.app
          test -x Pdc.app/Contents/MacOS/Pdc

          # Bundle CLI helpers next to the GUI binary (same as utils/build_script_mac_osx.sh).
          cp -f pdcd simplewallet connectivity_tool Pdc.app/Contents/MacOS/
          chmod a+x Pdc.app/Contents/MacOS/pdcd Pdc.app/Contents/MacOS/simplewallet Pdc.app/Contents/MacOS/connectivity_tool

          # Deploy Qt frameworks/plugins into the app bundle.
          MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"
          if [[ ! -x "$MACDEPLOYQT" ]]; then
            MACDEPLOYQT="$(find "$(brew --prefix)" -name macdeployqt 2>/dev/null | head -1)"
          fi
          test -x "$MACDEPLOYQT"
          # From build/src, repo root is ../.. (not ../../..). Skip ad-hoc codesign
          # during macdeployqt; we sign inside-out afterwards.
          "$MACDEPLOYQT" Pdc.app -always-overwrite -no-codesign || true

          # Rewrite Homebrew absolute paths and macdeployqt's
          # @executable_path/../Frameworks dylib loads. The latter resolves
          # inside QtWebEngineProcess and dyld aborts the helper (blank UI).
          chmod +x ../../utils/macos_fix_qt_webengine_rpaths.sh
          ../../utils/macos_fix_qt_webengine_rpaths.sh Pdc.app

          # Ship HTML under Resources (MacOS is code-only for codesign) + app icon.
          mkdir -p Pdc.app/Contents/Resources
          rsync -a ../../src/gui/qt-daemon/layout/html Pdc.app/Contents/Resources/ \
            --exclude less --exclude package.json --exclude gulpfile.js
          # Drop any stale CMake POST_BUILD copy under MacOS so codesign stays clean.
          rm -rf Pdc.app/Contents/MacOS/html
          cp -f ../../src/gui/qt-daemon/app.icns Pdc.app/Contents/Resources/

          # Ad-hoc sign inside-out (never --deep with app entitlements): that
          # would overwrite QtWebEngineProcess JIT entitlements and blank the UI.
          chmod +x ../../utils/macos_adhoc_codesign.sh
          ../../utils/macos_adhoc_codesign.sh Pdc.app ../../utils/macos_entitlements.plist

          # Sanity: GUI binary + html present; helpers must not pull non-portable paths.
          test -d Pdc.app/Contents/Resources/html
          test ! -e Pdc.app/Contents/MacOS/html
          HELPER="$(find Pdc.app/Contents -type f -path '*/QtWebEngineProcess.app/Contents/MacOS/QtWebEngineProcess' | head -1)"
          test -n "$HELPER"
          for b in Pdc.app/Contents/MacOS/Pdc Pdc.app/Contents/MacOS/pdcd Pdc.app/Contents/MacOS/simplewallet Pdc.app/Contents/MacOS/connectivity_tool "$HELPER"; do
            echo "==== otool $b ===="
            otool -L "$b"
            if otool -L "$b" | grep -E '@rpath/libboost_|/Users/runner/|libboost_[^ ]*\.dylib|/opt/homebrew/|/usr/local/opt/'; then
              echo "ERROR: $b still depends on a non-portable Homebrew/Boost/OpenSSL path"
              exit 1
            fi
          done
          QTCORE="$(find Pdc.app/Contents/Frameworks/QtCore.framework -type f -name QtCore | head -1)"
          test -n "$QTCORE"
          if otool -L "$QTCORE" | grep -q '@executable_path/../Frameworks/lib'; then
            echo "ERROR: QtCore still loads dylibs via @executable_path; QtWebEngineProcess will not start"
            otool -L "$QTCORE"
            exit 1
          fi

          rm -rf "Pdc-Gui-${TAG}"
          mkdir "Pdc-Gui-${TAG}"
          ditto Pdc.app "Pdc-Gui-${TAG}/Pdc.app"
          tar cvfz "Pdc-Gui-${TAG}-${LABEL}.tar.gz" "Pdc-Gui-${TAG}/"
          if [[ "${TAG}" != "${COMMIT_SHA}" ]]; then
            cp -f "Pdc-Gui-${TAG}-${LABEL}.tar.gz" "Pdc-Gui-${COMMIT_SHA}-${LABEL}.tar.gz"
          fi

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_content_type: application/gzip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}.tar.gz


  # Windows 10
  windows_build:
    name: Windows
    runs-on: windows-2022
    env:
      MSBUILD_PATH: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin"
      LABEL: windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Boost.Asio 1.84 still uses OpenSSL 1.1 ASN.1 internals; Chocolatey OpenSSL 4.x breaks the Windows build.
      - name: Cache OpenSSL 1.1.1w
        id: cache-openssl
        uses: actions/cache@v6
        with:
          path: C:/OpenSSL-Win64
          key: openssl-1.1.1w-win64-msvc2022-nasm-off

      - name: Install OpenSSL 1.1.1w
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fL -o openssl-1.1.1w.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          tar -xzf openssl-1.1.1w.tar.gz
          $vcvars = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
          $prefix = 'C:\OpenSSL-Win64'
          cmd /c "`"$vcvars`" && cd openssl-1.1.1w && perl Configure VC-WIN64A no-asm --prefix=$prefix --openssldir=$prefix && nmake && nmake install_sw"
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL 1.1.1w build failed' }
          if (-not (Test-Path "$prefix\include\openssl\ssl.h")) { throw 'OpenSSL ssl.h missing after install' }

      - name: Export OpenSSL 1.1.1w
        shell: pwsh
        run: |
          $prefix = 'C:\OpenSSL-Win64'
          echo "OPENSSL_ROOT_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "OpenSSL root: $prefix"

      # Install QT
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.12.12'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2017_64'
          modules: 'debug_info qtcharts qtdatavis3d qtnetworkauth qtpurchasing qtscript qtvirtualkeyboard qtwebengine qtwebglplugin'

      - name: Cache Boost 1.84.0
        id: cache-boost
        uses: actions/cache@v6
        with:
          path: C:/local/boost_1_84_0
          key: boost-1.84.0-win64-msvc-14.3-v1

      - name: Install Boost 1.84.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $link = "https://boost.teeks99.com/bin/1.84.0/boost_1_84_0-msvc-14.3-64.exe"
          $path = "C:\boost.exe"
          [Net.WebClient]::new().DownloadFile($link, $path)
          Start-Process C:\boost.exe -ArgumentList "/DIR=C:\local\boost_1_84_0","/VERYSILENT" -Wait
          Get-ChildItem C:\local\boost_1_84_0

      # Configure project with cmake
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -T host=x64 .. -DBUILD_GUI=ON -D BOOST_ROOT=C:/local/boost_1_84_0 -D BOOST_LIBRARYDIR="C:/local/boost_1_84_0/lib64-msvc-14.3" -D OPENSSL_ROOT_DIR=C:/OpenSSL-Win64 -D STATIC=OFF
          dir

      # Build for Windows
      - name: Build
        run: |
          $env:PATH = "$env:PATH;$env:MSBUILD_PATH"
          cd build
          dir
          MSBuild Pdc.sln /p:Configuration=Release /t:Build /m

      # Prepare for deploy
      - name: Prepare for Deploy
        shell: bash
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src/Release
          rm -rf Pdc-Gui-${TAG}
          mkdir Pdc-Gui-${TAG}
          dir
          cp Pdc.exe Pdc-Gui-${TAG}/
          cp /c/OpenSSL-Win64/bin/libssl-1_1-x64.dll Pdc-Gui-${TAG}/ || true
          cp /c/OpenSSL-Win64/bin/libcrypto-1_1-x64.dll Pdc-Gui-${TAG}/ || true
          D:/a/Pdc/Qt/5.12.12/msvc2017_64/bin/windeployqt.exe Pdc-Gui-${TAG}/Pdc.exe
          cp -r ../../../src/gui/qt-daemon/layout/html Pdc-Gui-${TAG}/html
          7z a Pdc-Gui-${TAG}-${LABEL}.zip Pdc-Gui-${TAG}
          cp ../../../utils/buildings/windows/64bit/setup_64.iss Pdc-Gui-${TAG}
          cp ../../../utils/buildings/windows/64bit/vc_redist.x64.exe Pdc-Gui-${TAG}

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Release/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.zip
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.zip
          asset_content_type: application/zip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Release/Pdc-Gui-${{ github.sha }}

      # Compile .ISS to .EXE Installer - No Release
      - name: Compile .ISS to .EXE Installer - No Release
        if: github.event_name != 'release' && !(startsWith(github.ref, 'refs/tags/'))
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: build/src/Release/Pdc-Gui-${{ github.sha }}/setup_64.iss
          options: /O+ /DBinariesPath=..\Pdc-Gui-${{ github.sha }} /O..\Pdc\build\src\Release /FPdc-Gui-${{ github.sha }}-${{ env.LABEL }}

      # Compile .ISS to .EXE Installer - Release
      - name: Compile .ISS to .EXE Installer - Release
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: build/src/Release/Pdc-Gui-${{ github.event.release.tag_name }}/setup_64.iss
          options: /O+ /DBinariesPath=..\Pdc-Gui-${{ github.event.release.tag_name }} /O..\Pdc\build\src\Release /FPdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}

      # Upload to GH Actions Artifacts EXE
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}.exe
          path: ./build/src/Release/Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}.exe

      # Upload to GH Release EXE
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Release/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.exe
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.exe
          asset_content_type: application/octet-stream
