# Public restricted pdcd RPC for iOS/remote wallets (sync + transfer).
#
# Architecture (same host — pool / pool wallets / Trade / Explorer unchanged):
#   pdcd full RPC:     127.0.0.1:19211
#   nginx (public):    169.58.142.131:19211  → allowlist + JSON-RPC filter
#   JSON-RPC filter:   127.0.0.1:19215     → 127.0.0.1:19211
#
# Install:
#   sudo cp nginx-pdcd-public-rpc.conf /etc/nginx/sites-available/pdcd-public-rpc
#   sudo ln -sf /etc/nginx/sites-available/pdcd-public-rpc /etc/nginx/sites-enabled/
#   # After pdcd is bound to 127.0.0.1:19211 only:
#   sudo nginx -t && sudo systemctl reload nginx

upstream pdcd_full_rpc {
    server 127.0.0.1:19211;
    keepalive 8;
}

upstream pdcd_json_rpc_filter {
    server 127.0.0.1:19215;
    keepalive 8;
}

server {
    # Bind ONLY the public address — leave 127.0.0.1:19211 for pdcd (pool wallets, etc.)
    listen 169.58.142.131:19211;
    # Optional IPv6 public (same host):
    listen [2a02:c207:2349:3786::1]:19211;
    server_name _;

    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # --- Allowlist: iOS / remote-node wallet sync + transfer ---
    location = /getinfo {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /getheight {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /gettransactions {
        proxy_pass http://pdcd_full_rpc;
    }
    # Transfer broadcast (wallet2 / iOS FFI → /sendrawtransaction)
    location = /sendrawtransaction {
        proxy_pass http://pdcd_full_rpc;
    }

    location = /getblocks.bin {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /get_o_indexes.bin {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /getrandom_outs.bin {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /getrandom_outs1.bin {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /getrandom_outs3.bin {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /get_tx_pool.bin {
        proxy_pass http://pdcd_full_rpc;
    }
    location = /check_keyimages.bin {
        proxy_pass http://pdcd_full_rpc;
    }

    # JSON-RPC: method allowlist (sync/read); mining methods → 403
    location = /json_rpc {
        proxy_pass http://pdcd_json_rpc_filter;
    }
    location = /json_rpc/ {
        proxy_pass http://pdcd_json_rpc_filter;
    }

    # Explicit denies (defense in depth)
    location = /start_mining { return 403; }
    location = /stop_mining { return 403; }
    location = /force_relay { return 403; }
    location = /set_maintainers_info.bin { return 403; }
    location = /get_pos_details.bin { return 403; }

    location / {
        default_type application/json;
        return 403 '{"status":"Forbidden","reason":"pdcd public RPC allowlist"}';
    }
}
